<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 218" width="100%" role="img" aria-label="#04 Smart Security System">
  <defs>
    <style>
      .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="528" height="216" rx="18" fill="#121126" stroke="#1e1b4b" stroke-width="1.2" />

  <!-- Top Row: FolderGit2 Icon + Index + Domain Badge + Period / Inspecting Pill -->
  <g transform="translate(22, 20)">
    <!-- Folder Icon -->
    <path d="M2 5a2 2 0 0 1 2-2h3.2a1 1 0 0 1 .8.4l1.2 1.6H14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5z" fill="none" stroke="#818cf8" stroke-width="1.4" />
    <text x="22" y="14" class="mono" font-size="12.5" font-weight="700" fill="#818cf8">#04</text>

    <g transform="translate(56, 0)">
      <rect x="0" y="0" width="126" height="20" rx="10" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
      <text x="63" y="13.5" text-anchor="middle" class="mono" font-size="10" fill="#818cf8">Embedded &amp; Systems</text>
    </g>

    <text x="486" y="14" text-anchor="end" class="mono" font-size="11" fill="#71717a">Nov 2025 — Dec 2025</text>
  </g>

  <!-- Project Title -->
  <text x="22" y="66" class="sans" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Smart Security System</text>

  <!-- 3-Line Description -->
  <text x="22" y="92" class="sans" font-size="12" fill="#a1a1aa">Engineered a 3-node edge IoT security system in a 3-person team, connecting</text>
  <text x="22" y="110" class="sans" font-size="12" fill="#a1a1aa">a Raspberry Pi AI gateway and two dual-core FreeRTOS ESP32 nodes over</text>
  <text x="22" y="128" class="sans" font-size="12" fill="#a1a1aa">CoreIoT MQTT telemetry and RPC channels. Built an async Python gateway…</text>

  <!-- Bottom Divider -->
  <line x1="22" y1="164" x2="508" y2="164" stroke="#1e1b4b" stroke-width="1" />

  <!-- Tech Stack Pills -->
  <g transform="translate(22, 177)">
      <rect x="0" y="0" width="50" height="22" rx="6" fill="#090814" stroke="#1e1b4b" stroke-width="1" />
      <text x="25" y="14.5" text-anchor="middle" class="sans" font-size="10.5" font-weight="500" fill="#d4d4d8">Python</text>
    </g>
  <g transform="translate(78, 177)">
      <rect x="0" y="0" width="36" height="22" rx="6" fill="#090814" stroke="#1e1b4b" stroke-width="1" />
      <text x="18" y="14.5" text-anchor="middle" class="sans" font-size="10.5" font-weight="500" fill="#d4d4d8">C++</text>
    </g>
  <g transform="translate(120, 177)">
      <rect x="0" y="0" width="68" height="22" rx="6" fill="#090814" stroke="#1e1b4b" stroke-width="1" />
      <text x="34" y="14.5" text-anchor="middle" class="sans" font-size="10.5" font-weight="500" fill="#d4d4d8">FreeRTOS</text>
    </g>
  <g transform="translate(194, 177)">
      <rect x="0" y="0" width="80" height="22" rx="6" fill="#090814" stroke="#1e1b4b" stroke-width="1" />
      <text x="40" y="14.5" text-anchor="middle" class="sans" font-size="10.5" font-weight="500" fill="#d4d4d8">Raspberry Pi</text>
    </g>
  <text x="284" y="192" class="mono" font-size="10.5" fill="#71717a">+4</text>

  <!-- Right Action Indicator -->
  <text x="508" y="192" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#818cf8">View Source ↗</text>
</svg>
