<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 284" width="100%" role="img" aria-label="Hoang Nhat Minh — Full-stack Developer">
  <defs>
    <style>
      .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>

    <radialGradient id="bg-glow-left" cx="15%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#090814" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bg-glow-right" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#090814" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="hero-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55">
        <animate attributeName="stop-color" values="#818cf8;#312e81;#c7d2fe;#818cf8" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.55">
        <animate attributeName="stop-color" values="#6366f1;#c7d2fe;#1e1b4b;#6366f1" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#818cf8" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Base Canvas Plate -->
  <rect x="1" y="1" width="1078" height="282" rx="24" fill="#090814" stroke="url(#hero-border)" stroke-width="1.8" />
  <rect x="1" y="1" width="1078" height="282" rx="24" fill="url(#bg-glow-left)" />
  <rect x="1" y="1" width="1078" height="282" rx="24" fill="url(#bg-glow-right)" />
  <rect x="1" y="1" width="1078" height="282" rx="24" fill="url(#dot-grid)" />

  <!-- Top 1px Specular Highlight -->
  <line x1="40" y1="2" x2="1040" y2="2" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1" />

  <!-- ================================================================= -->
  <!-- ROW 1: IDENTITY + LIVE STATUS BADGES                              -->
  <!-- ================================================================= -->
  <text x="36" y="56" class="sans" font-size="32" font-weight="700" fill="#ffffff" letter-spacing="-0.7">Hoang Nhat Minh</text>
  <text x="36" y="82" class="sans" font-size="16" font-weight="600" fill="#818cf8">Full-stack Developer</text>

  <!-- Right Status & Handle Pills -->
  <g transform="translate(712, 32)">
    <rect x="0" y="0" width="204" height="32" rx="10" fill="#121126" stroke="#1e1b4b" stroke-width="1.2" />
    <circle cx="18" cy="16" r="3.8" fill="#818cf8">
      <animate attributeName="r" values="3.8;5.2;3.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="18" cy="16" r="7.5" fill="none" stroke="#818cf8" stroke-width="1">
      <animate attributeName="r" values="4;10.5;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20.5" class="mono" font-size="11.5" font-weight="600" fill="#818cf8">ONLINE · HCMC UTC+7</text>
  </g>

  <g transform="translate(926, 32)">
    <rect x="0" y="0" width="118" height="32" rx="10" fill="#121126" stroke="#1e1b4b" stroke-width="1.2" />
    <text x="59" y="20.5" text-anchor="middle" class="mono" font-size="12" fill="#d4d4d8">@hoangm960</text>
  </g>

  <!-- ================================================================= -->
  <!-- ROW 2: TAGLINE                                                    -->
  <!-- ================================================================= -->
  <text x="36" y="118" class="sans" font-size="17" font-weight="500" fill="#e4e4e7">A Jack-of-all-trades with ADHD eager to learn everything this little head can fit.</text>

  <!-- ================================================================= -->
  <!-- ROW 3: 3-COLUMN AUTO-COMPUTED STAT STRIP                          -->
  <!-- ================================================================= -->
  <g transform="translate(36, 138)">
    <!-- Card 1: Years Coding -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="324" height="72" rx="14" fill="#121126" fill-opacity="0.9" stroke="#1e1b4b" stroke-width="1.3" />
      <text x="22" y="33" class="mono" font-size="25" font-weight="700" fill="#ffffff">6+</text>
      <text x="22" y="55" class="sans" font-size="13.5" font-weight="500" fill="#d4d4d8">Years Coding</text>
      <text x="302" y="42" text-anchor="end" class="mono" font-size="11.5" fill="#a1a1aa">2020 — PRESENT</text>
    </g>

    <!-- Card 2: Key Projects -->
    <g transform="translate(342, 0)">
      <rect x="0" y="0" width="324" height="72" rx="14" fill="#121126" fill-opacity="0.9" stroke="#1e1b4b" stroke-width="1.3" />
      <text x="22" y="33" class="mono" font-size="25" font-weight="700" fill="#818cf8">12</text>
      <text x="22" y="55" class="sans" font-size="13.5" font-weight="500" fill="#d4d4d8">Key Projects</text>
      <text x="302" y="42" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#818cf8">WEB · AI · EMBEDDED</text>
    </g>

    <!-- Card 3: Technologies -->
    <g transform="translate(684, 0)">
      <rect x="0" y="0" width="324" height="72" rx="14" fill="#121126" fill-opacity="0.9" stroke="#1e1b4b" stroke-width="1.3" />
      <text x="22" y="33" class="mono" font-size="25" font-weight="700" fill="#ffffff">61</text>
      <text x="22" y="55" class="sans" font-size="13.5" font-weight="500" fill="#d4d4d8">Technologies</text>
      <text x="302" y="42" text-anchor="end" class="mono" font-size="11.5" fill="#a1a1aa">6 STACK LAYERS</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- ROW 4: BOTTOM LOCATION, CONTACT & PORTFOLIO BAR                   -->
  <!-- ================================================================= -->
  <line x1="36" y1="224" x2="1044" y2="224" stroke="#1e1b4b" stroke-width="1" />

  <g transform="translate(36, 235)">
    <!-- Location Pill -->
    <rect x="0" y="0" width="162" height="34" rx="9" fill="#121126" stroke="#1e1b4b" stroke-width="1.2" />
    <path d="M18 11c-2.4 0-4.4 2-4.4 4.4 0 3.3 4.4 7.6 4.4 7.6s4.4-4.3 4.4-7.6c0-2.4-2-4.4-4.4-4.4zm0 6a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2z" fill="#818cf8" />
    <text x="32" y="21.5" class="sans" font-size="13" font-weight="500" fill="#d4d4d8">District 7, HCMC</text>

    <!-- Email Pill -->
    <g transform="translate(174, 0)">
      <rect x="0" y="0" width="218" height="34" rx="9" fill="#121126" stroke="#1e1b4b" stroke-width="1.2" />
      <rect x="13" y="12" width="12" height="9" rx="1.5" fill="none" stroke="#818cf8" stroke-width="1.4" />
      <path d="M13 13l6 4.5 6-4.5" fill="none" stroke="#818cf8" stroke-width="1.4" />
      <text x="33" y="21.5" class="sans" font-size="13" font-weight="500" fill="#e4e4e7">hnminh.work@gmail.com</text>
    </g>

    <!-- Primary Portfolio CTA Pill -->
    <g transform="translate(696, 0)">
      <rect x="0" y="0" width="312" height="34" rx="9" fill="#818cf8" />
      <text x="156" y="21.5" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#090814">Interactive Portfolio · hoangm960.github.io ↗</text>
    </g>
  </g>
</svg>
