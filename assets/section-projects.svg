  </g>
  <g transform="translate(830, 32)">
    <rect x="0" y="0" width="90" height="30" rx="8" fill="#121126" stroke="#1e1b4b" stroke-width="1" />
    <text x="45" y="19.5" text-anchor="middle" class="sans" font-size="11.5" font-weight="500" fill="#a1a1aa">AI &amp; DSP (3)</text>
  </g>
  <g transform="translate(692, 32)">
